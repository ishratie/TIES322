!
! FRRouting configuration file
!
log file /var/log/frr/frr.log
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 3
        no bgp ebgp-requires-policy
        no bgp network import-check
        neighbor 193.10.11.1 remote-as 1
        neighbor 193.10.11.1 description Router 1 of AS1
        neighbor 193.10.11.1 prefix-list toAS1 out
        neighbor 193.10.11.2 remote-as 2
        neighbor 193.10.11.2 description Router 2 of AS2
        neighbor 193.10.11.2 prefix-list toAS2 out
        !
        network 201.1.1.0/24
        network 201.1.2.0/24
        network 201.1.3.0/24
!
ip prefix-list toAS1 permit 201.1.1.0/24
ip prefix-list toAS1 permit 201.1.2.0/24
ip prefix-list toAS1 deny any
!
ip prefix-list toAS2 permit 201.1.1.0/24
ip prefix-list toAS2 permit 201.1.3.0/24
ip prefix-list toAS2 deny any
!